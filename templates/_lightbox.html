<!-- ================= LIGHTBOX APERÇU PHOTOS ================= -->
<style>
  .lb{position:fixed;inset:0;background:rgba(5,12,22,.94);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
  .lb.open{display:flex}
  body.lb-lock{overflow:hidden}
  .veh-art,.vp-thumb{position:relative}
  .lb-img{max-width:min(94vw,1200px);max-height:82vh;object-fit:contain;border-radius:10px;box-shadow:0 26px 80px rgba(0,0,0,.6);position:relative;z-index:2;background:#fff}
  .lb-cap{color:#e8eef7;font-weight:800;font-size:16px;margin-top:16px;z-index:2;text-align:center}
  .lb-count{color:#8fa3bd;font-size:13px;font-weight:600;margin-top:5px;z-index:2}
  .lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:background .15s,transform .15s;padding:0}
  .lb-btn:hover{background:rgba(255,255,255,.22);transform:scale(1.06)}
  .lb-btn.hide{display:none}
  .lb-prev{left:16px;top:50%;transform:translateY(-50%)}
  .lb-prev:hover{transform:translateY(-50%) scale(1.06)}
  .lb-next{right:16px;top:50%;transform:translateY(-50%)}
  .lb-next:hover{transform:translateY(-50%) scale(1.06)}
  .lb-close{top:16px;right:16px}
  .veh-zoom,.vp-zoom{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(7,18,33,.55);color:#fff;backdrop-filter:blur(3px);z-index:2;pointer-events:none}
  .veh-zoom{top:10px;right:10px;width:36px;height:36px}
  .vp-zoom{top:8px;right:8px;width:30px;height:30px}
  .veh-art,.vp-thumb{cursor:zoom-in}
  .vp-thumb{display:block}
  @media (max-width:700px){
    .lb-btn{width:42px;height:42px}
    .lb-prev{left:8px}
    .lb-next{right:8px}
    .lb-close{top:10px;right:10px}
  }
</style>
<div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="Aperçu de la photo">
  <button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="Photo précédente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button type="button" class="lb-btn lb-next" id="lbNext" aria-label="Photo suivante"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <img id="lbImg" class="lb-img" alt="">
  <div id="lbCap" class="lb-cap"></div>
  <div id="lbCount" class="lb-count"></div>
</div>
<script>
var LB_ITEMS = [];
var LB_IDX = 0;
var LB_ZOOM = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>';

function lbEl(id){ return document.getElementById(id); }

function lbShow(){
  if(!LB_ITEMS.length) return;
  var img = lbEl('lbImg');
  img.src = LB_ITEMS[LB_IDX];
  lbEl('lbPrev').className = 'lb-btn lb-prev' + (LB_ITEMS.length > 1 ? '' : ' hide');
  lbEl('lbNext').className = 'lb-btn lb-next' + (LB_ITEMS.length > 1 ? '' : ' hide');
  lbEl('lbCount').textContent = LB_ITEMS.length > 1 ? (LB_IDX + 1) + ' / ' + LB_ITEMS.length : '';
}

function openLightbox(items, caption){
  LB_ITEMS = (items || []).filter(function(s){ return s && s.indexOf('/static/') === 0; });
  if(!LB_ITEMS.length) return;
  LB_IDX = 0;
  lbEl('lbImg').alt = caption || '';
  lbEl('lbCap').textContent = caption || '';
  lbShow();
  lbEl('lightbox').classList.add('open');
  document.body.classList.add('lb-lock');
}

function closeLightbox(){
  lbEl('lightbox').classList.remove('open');
  document.body.classList.remove('lb-lock');
  lbEl('lbImg').src = '';
}

function lbStep(d){
  if(!LB_ITEMS.length) return;
  LB_IDX = (LB_IDX + d + LB_ITEMS.length) % LB_ITEMS.length;
  lbShow();
}

(function(){
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function(){ lbStep(-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ lbStep(1); });
  document.getElementById('lightbox').addEventListener('click', function(e){
    if(e.target === this) closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') lbStep(-1);
    else if(e.key === 'ArrowRight') lbStep(1);
  });
})();
</script>
